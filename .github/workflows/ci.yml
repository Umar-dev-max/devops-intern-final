name: CI

on:
  push:
    branches: [ main ]

jobs:
  run-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check hello.py syntax
        run: python -m py_compile hello.py
